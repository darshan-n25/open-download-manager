# An Open Download Manager daemon on a machine with no desktop, reachable from the browser extension on
# your laptop or from `curl`.
#
#   docker compose -f deploy/compose.yaml up -d
#   curl http://127.0.0.1:1001/api/jobs
#
# The port is published on the host's *loopback only*, so nothing on the network can reach it
# and no token is needed. To reach it from another machine, see "Reachable from the network"
# at the bottom of this file — that change is exactly the one that requires a token.
services:
  odm-cli:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: odm-cli:local
    container_name: odm-cli
    restart: unless-stopped

    # `0.0.0.0` inside the container; the publish rule below is what limits who can connect.
    command: ["daemon", "--addr", "0.0.0.0:1001"]

    ports:
      - "127.0.0.1:1001:1001"

    volumes:
      # One volume holds the queue, the quota window, the recurring projects, the offline
      # mirrors, the configuration and (by default) the downloads.
      - odm-cli-data:/data
      # Downloads can go somewhere more convenient; then point the config at it:
      #   docker compose -f deploy/compose.yaml exec odm-cli odm-cli config set download_dir /downloads
      # - /mnt/media/downloads:/downloads

    environment:
      # Uncomment together with a wider `ports` rule, never before it. Inside the container
      # every interface is local, so this is invisible from the host.
      # ODM_DAEMON_TOKEN: ${ODM_DAEMON_TOKEN:?set a token or bind to loopback only}

    # Must exceed the daemon's own five-second shutdown grace, or `docker stop` escalates to
    # SIGKILL while jobs were still saving. Fifteen leaves room.
    stop_grace_period: 15s

    # No healthcheck: a scratch image has no shell and no curl to run one with. Probe
    # `http://127.0.0.1:1001/health` from outside — that is what a Kubernetes
    # `httpGet` probe is for.

volumes:
  odm-cli-data:

# Reachable from the network
# --------------------------
# Change the publish rule to `"1001:1001"` and set a token in the same edit:
#
#   ports:
#     - "1001:1001"
#   environment:
#     ODM_DAEMON_TOKEN: "a long random string"
#
# Both halves, together: the daemon refuses to be a silent open door, and with a token set it
# requires `Authorization: Bearer <token>` or `?token=<token>` on every request, including
# `/health`. Generate one with:
#
#   odm-cli daemon --generate-token-file /tmp/odm-cli-token
#
# The extension has no way to send a request header during the WebSocket handshake from a
# page context, so it uses the `?token=` form; that is why both carriers exist.
