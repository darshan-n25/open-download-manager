name: CI

# Riptide claims to run on Linux, macOS and Windows. A claim like that is only worth
# anything if something runs the tests on all three, so this workflow is the evidence:
#
#   test        — the whole suite, natively, on ubuntu / macos / windows, plus clippy and
#                 rustfmt, plus both macOS architectures (the runners are arm64; Intel
#                 macOS is cross-built from there).
#   cross       — `cargo check --all-targets` for the targets whose libraries do not get
#                 run in the matrix: static musl, aarch64 Linux and Windows (GNU). Each
#                 needs a cross C toolchain only because `ring` is C and assembly.
#   static      — builds the fully static Linux binary and proves it is static.
#
# This file has not been executed yet: the repository it lives in has no git remote and
# its author's machine is an x86_64 Linux box with no passwordless package install, so the
# non-Linux jobs here are written, reviewed and *unrun*. Everything they cover that could
# be checked without a second machine is checked by `scripts/check-portability.sh`, which
# compiles the platform module for all seven targets on any host.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Browser-extension protocol tests
        run: node --test extension/tests/protocol.test.mjs

      # The runners are arm64, so the other half of the macOS world would otherwise never
      # be compiled. This is a build, not a test run: x86_64 binaries cannot execute here.
      - name: Build the other macOS architecture
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --locked --target x86_64-apple-darwin

      # Windows is the only platform where the positional-write binding is `seek_write`
      # rather than `write_at`, and the only one where a name can be a device. The tests
      # above cover both; this proves which arch they ran on.
      - name: What was tested
        run: rustc -vV

  cross:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # A static binary for any glibc-less Linux (Alpine, a container scratch image).
          - target: x86_64-unknown-linux-musl
            packages: musl-tools
            cc: musl-gcc
          # The architecture most Linux servers and all Apple silicon are; glibc target.
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
          # A second Windows toolchain, cross-compiled from Linux. `x86_64-pc-windows-gnu`
          # shares the `cfg(windows)` code with msvc but not the ABI, so it is a cheap way
          # to catch code that only compiles against one of them.
          - target: x86_64-pc-windows-gnu
            packages: gcc-mingw-w64-x86-64 nasm
            cc: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cross C toolchain (for ring)
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      # `ring` compiles C and assembly with `cc`, which reads `CC_<target>`; rustc needs a
      # linker that is not the default `cc` for a foreign architecture. Only the
      # target-specific names are set, so build scripts and proc macros (which are built for
      # the *host*) keep using the host compiler.
      - name: Check every target of the crate
        run: |
          target_underscored=$(echo '${{ matrix.target }}' | tr '-' '_')
          export "CC_${target_underscored}=${{ matrix.cc }}"
          export "CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_LINKER=${{ matrix.cc }}"
          cargo check --all-targets --locked --target '${{ matrix.target }}'

  static:
    name: static Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cross C toolchain (for ring)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils file

      - name: Build
        env:
          # Without this the cross build fails inside `ring`: `cc` looks for
          # `x86_64-linux-musl-gcc`, which `musl-tools` does not provide (it provides
          # `musl-gcc`). Verified on the authoring machine, where the default lookup fails
          # with `ToolNotFound: failed to find tool "x86_64-linux-musl-gcc"`.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      # The point of the static build is that it runs on a system with no libc to speak of,
      # so "it built" is not the claim — "no dynamic interpreter and no shared libraries"
      # is. `ldd` says so in one line.
      - name: Prove it is static
        run: |
          bin=target/x86_64-unknown-linux-musl/release/riptide
          file "$bin"
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "::error::$bin links against shared libraries"
            ldd "$bin"
            exit 1
          fi

      - name: Run it anyway
        run: |
          target/x86_64-unknown-linux-musl/release/riptide --version

      - uses: actions/upload-artifact@v4
        with:
          name: riptide-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/riptide

  # Compiles the platform module for all seven targets from one host. It is a step in its
  # own right because it needs no toolchain at all — just `rustup target add` — so it is
  # the check that works on the machine you are sitting at.
  portability:
    name: platform module for every target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-msvc,x86_64-pc-windows-gnu

      - run: ./scripts/check-portability.sh
