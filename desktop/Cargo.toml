[package]
name = "riptide-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["svg"] }
egui-lucide = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
riptide = { path = ".." }
