[package]
name = "riptide"
version = "0.1.0"
edition = "2021"
description = "Riptide — an open-source, cross-platform download manager in the spirit of Internet Download Manager"
license = "MIT"

[[bin]]
name = "riptide"
path = "src/main.rs"

[lib]
name = "riptide"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-webpki-roots", "socks", "cookies", "http2"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
futures-util = "0.3"
bytes = "1"
base64 = "0.22"
md-5 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
md4 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
percent-encoding = "2"
regex = "1"
tokio-tungstenite = "0.24"
humantime = "2"
quick-xml = "0.36"
aes = "0.8"
cbc = "0.1"

[dev-dependencies]
tempfile = "3"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
